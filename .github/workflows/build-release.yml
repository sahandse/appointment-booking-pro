name: Build appointment-booking-pro Installable ZIP

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'assets/**'
      - 'includes/**'
      - 'languages/**'
      - 'readme.txt'
      - 'README.md'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'Version:' appointment-booking-pro.php | head -1 | sed 's/.*Version:[[:space:]]*//')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Build ZIP
        shell: bash
        run: |
          rm -rf dist build
          mkdir -p dist build/appointment-booking-pro
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='dist' ./ build/appointment-booking-pro/
          cd build
          zip -qr ../dist/appointment-booking-pro.zip appointment-booking-pro
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appointment-booking-pro-v${{ steps.version.outputs.version }}
          path: dist/appointment-booking-pro.zip
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="appointment-booking-pro-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/appointment-booking-pro.zip --clobber
          else
            gh release create "$TAG" dist/appointment-booking-pro.zip --title "appointment-booking-pro v${VERSION}" --notes "Installable WordPress ZIP for appointment-booking-pro v${VERSION}."
          fi
